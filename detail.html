<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Form Details - Dforms803</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f7f6;
    color:#333;
    line-height:1.6;
}

header{
    background:#1a365d;
    color:white;
    padding:15px 20px;
}

header h1{
    font-size:26px;
    color:#63b3ed;
}

nav{
    background:#2b6cb0;
    padding:12px 20px;
}

nav a{
    color:white;
    text-decoration:none;
    font-weight:bold;
}

.container{
    max-width:1000px;
    margin:20px auto;
    background:white;
    padding:25px;
    border-radius:8px;
    box-shadow:0 4px 6px rgba(0,0,0,.05);
}

.post-title{
    font-size:24px;
    color:#1a365d;
    margin-bottom:10px;
    border-bottom:2px solid #3182ce;
    padding-bottom:8px;
}

.category{
    display:inline-block;
    background:#3182ce;
    color:white;
    padding:4px 9px;
    border-radius:4px;
    font-size:12px;
    margin-bottom:15px;
}

.info-grid{
    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(280px,1fr));
    gap:20px;
    margin:20px 0 25px;
}

.info-box{
    background:#f7fafc;
    border:1px solid #e2e8f0;
    padding:15px;
    border-radius:6px;
}

.info-box h3{
    color:#2c5282;
    margin-bottom:10px;
    font-size:16px;
    border-bottom:1px solid #cbd5e0;
    padding-bottom:5px;
}

.info-box ul{
    list-style:none;
    font-size:14px;
}

.info-box li{
    margin-bottom:8px;
}

.section-title{
    color:#2c5282;
    margin:20px 0 10px;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-bottom:25px;
}

table,
th,
td{
    border:1px solid #cbd5e0;
}

th,
td{
    padding:10px;
    text-align:left;
    font-size:14px;
}

th{
    background:#ebf8ff;
    color:#2c5282;
}

.btn-apply{
    display:inline-block;
    background:#38a169;
    color:white;
    padding:9px 18px;
    text-decoration:none;
    border-radius:5px;
    font-weight:bold;
}

.btn-apply:hover{
    background:#2f855a;
}

.action-link{
    color:#3182ce;
    font-weight:bold;
    text-decoration:none;
}

.action-link:hover{
    text-decoration:underline;
}

.loading{
    text-align:center;
    padding:30px;
    color:#718096;
}

.error{
    text-align:center;
    color:#c53030;
    padding:30px;
}

.back-btn{
    display:inline-block;
    margin-top:10px;
    color:#3182ce;
    font-weight:bold;
    text-decoration:none;
}

footer{
    text-align:center;
    padding:20px;
    margin-top:40px;
    background:#1a365d;
    color:white;
    font-size:14px;
}

@media(max-width:600px){

    .container{
        margin:10px;
        padding:18px;
    }

    .post-title{
        font-size:20px;
    }

    th,
    td{
        font-size:13px;
        padding:8px;
    }
}
</style>
</head>

<body>

<header>

<h1>Dforms803</h1>

</header>


<nav>

<a href="index.html">
← Back to Home
</a>

</nav>


<div class="container" id="detailsContainer">

<div class="loading">
Form details loading...
</div>

</div>


<footer>

<p>
© 2026 Dforms803. All Rights Reserved.
</p>

</footer>


<script>

/* ==================================
   SUPABASE CONFIG
================================== */

const SUPABASE_URL =
"https://" + "dxdhouchxmsibyjrnagq.supabase.co";

const SUPABASE_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR4ZGhvdWNoeG1zaWJ5anJuYWdxIiwicm9sZSI6IkFub24iLCJpYXQiOjE3ODY1NTE1MTUsImV4cCI6MjEwMjEyNzUxNX0.4nQFAiB2aFPtFKJfgq7LNr20AWEE0knx3BH8r-ljhwc";

const API_URL =
SUPABASE_URL + "/rest/v1/posts";


const headers = {

    "apikey": SUPABASE_KEY,

    "Authorization":
    "Bearer " + SUPABASE_KEY

};


/* ==================================
   CATEGORY NAME
================================== */

function getCategoryName(category){

    if(category==="latest")
        return "Latest Forms";

    if(category==="admit")
        return "Admit Cards";

    if(category==="result")
        return "Results";

    return category || "Forms";

}


/* ==================================
   SAFE TEXT
================================== */

function escapeHTML(value){

    if(value === null || value === undefined){
        return "";
    }

    return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* ==================================
   LOAD FORM
================================== */

async function loadForm(){

    const container =
    document.getElementById(
        "detailsContainer"
    );


    const params =
    new URLSearchParams(
        window.location.search
    );


    const postId =
    params.get("id");


    if(!postId){

        showNotFound();

        return;

    }


    try{

        const response =
        await fetch(

            API_URL +
            "?select=*" +
            "&id=eq." +
            encodeURIComponent(postId),

            {
                method:"GET",
                headers:headers
            }

        );


        if(!response.ok){

            throw new Error(
                await response.text()
            );

        }


        const posts =
        await response.json();


        if(posts.length===0){

            showNotFound();

            return;

        }


        const post =
        posts[0];


        renderPost(post);

    }

    catch(error){

        console.error(error);

        container.innerHTML = `

            <div class="error">

                <h2>
                    Form Details Load नहीं हो सकीं
                </h2>

                <p>
                    Please try again later.
                </p>

                <br>

                <a
                href="index.html"
                class="back-btn">

                    ← Back to Homepage

                </a>

            </div>

        `;

    }

}


/* ==================================
   RENDER
================================== */

function renderPost(post){

    document.title =
    (post.title || "Form Details")
    + " - Dforms803";


    const container =
    document.getElementById(
        "detailsContainer"
    );


    const applyLink =
    post.apply_link || "";


    const notifLink =
    post.notif_link || "";


    const officialLink =
    post.official_link || "";


    let notificationRow = "";

    if(notifLink){

        notificationRow = `

        <tr>

            <td>
                Download Official Notification
            </td>

            <td>

                <a
                href="${escapeHTML(notifLink)}"
                target="_blank"
                rel="noopener noreferrer"
                class="action-link">

                    Download PDF

                </a>

            </td>

        </tr>

        `;

    }


    let officialRow = "";

    if(officialLink){

        officialRow = `

        <tr>

            <td>
                Official Website
            </td>

            <td>

                <a
                href="${escapeHTML(officialLink)}"
                target="_blank"
                rel="noopener noreferrer"
                class="action-link">

                    Visit Official Site

                </a>

            </td>

        </tr>

        `;

    }


    let applyButton = "";

    if(applyLink){

        applyButton = `

        <a
        href="${escapeHTML(applyLink)}"
        target="_blank"
        rel="noopener noreferrer"
        class="btn-apply">

            Apply Online

        </a>

        `;

    }
    else{

        applyButton = "Apply link not available";

    }


    container.innerHTML = `

        <span class="category">

            ${escapeHTML(
                getCategoryName(post.category)
            )}

        </span>


        <h2 class="post-title">

            ${escapeHTML(post.title)}

        </h2>


        <div class="info-grid">


            <div class="info-box">

                <h3>
                    Important Dates
                </h3>

                <ul>

                    <li>

                        <strong>
                            Application Start:
                        </strong>

                        ${escapeHTML(
                            post.start_date || "Notify Soon"
                        )}

                    </li>


                    <li>

                        <strong>
                            Last Date to Apply:
                        </strong>

                        ${escapeHTML(
                            post.last_date || "Notify Soon"
                        )}

                    </li>


                    <li>

                        <strong>
                            Exam Date:
                        </strong>

                        ${escapeHTML(
                            post.exam_date || "Notify Soon"
                        )}

                    </li>

                </ul>

            </div>


            <div class="info-box">

                <h3>
                    Application Fee
                </h3>

                <ul>

                    <li>

                        <strong>
                            General / OBC / EWS:
                        </strong>

                        ${escapeHTML(
                            post.fee_gen || "₹0"
                        )}

                    </li>


                    <li>

                        <strong>
                            SC / ST / Female:
                        </strong>

                        ${escapeHTML(
                            post.fee_sc || "₹0"
                        )}

                    </li>


                    <li>

                        <strong>
                            Payment Mode:
                        </strong>

                        ${escapeHTML(
                            post.pay_mode || "Online"
                        )}

                    </li>

                </ul>

            </div>


        </div>


        <h3 class="section-title">

            Age Limit & Qualification

        </h3>


        <table>

            <tr>

                <th>
                    Age Limit
                </th>

                <th>
                    Qualification Required
                </th>

            </tr>


            <tr>

                <td>

                    ${escapeHTML(
                        post.age_limit || "As per rules"
                    )}

                </td>


                <td>

                    ${escapeHTML(
                        post.qualification ||
                        "Specified in Official Notice"
                    )}

                </td>

            </tr>

        </table>


        <h3 class="section-title">

            Important Links

        </h3>


        <table>

            <tr>

                <th>
                    Link Description
                </th>

                <th>
                    Action
                </th>

            </tr>


            <tr>

                <td>
                    Apply Online
                </td>

                <td>
                    ${applyButton}
                </td>

            </tr>


            ${notificationRow}

            ${officialRow}


        </table>


        <a
        href="index.html"
        class="back-btn">

            ← Back to Homepage

        </a>

    `;

}


/* ==================================
   NOT FOUND
================================== */

function showNotFound(){

    const container =
    document.getElementById(
        "detailsContainer"
    );


    container.innerHTML = `

        <div class="error">

            <h2>
                Form Not Found!
            </h2>

            <p>
                यह form उपलब्ध नहीं है या remove किया जा चुका है।
            </p>

            <br>

            <a
            href="index.html"
            class="back-btn">

                ← Back to Homepage

            </a>

        </div>

    `;

}


/* ==================================
   START
================================== */

window.onload =
loadForm;

</script>

</body>
</html>
