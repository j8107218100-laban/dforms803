<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dforms803 - Admin Panel</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f7f6;
    color:#333;
}

header{
    background:#1a365d;
    color:white;
    padding:15px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

header h1{
    font-size:24px;
    color:#63b3ed;
}

.container{
    max-width:850px;
    margin:30px auto;
    background:white;
    padding:25px;
    border-radius:8px;
    box-shadow:0 4px 10px rgba(0,0,0,.1);
}

h2{
    color:#2c5282;
    margin-bottom:18px;
    border-bottom:2px solid #3182ce;
    padding-bottom:7px;
}

#dashboard{
    display:none;
}

.form-row{
    display:flex;
    gap:15px;
}

.form-group{
    flex:1;
    margin-bottom:15px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:6px;
    font-size:13px;
    color:#4a5568;
}

input,
select,
textarea{
    width:100%;
    padding:10px;
    border:1px solid #cbd5e0;
    border-radius:4px;
    font-size:14px;
}

.btn{
    background:#3182ce;
    color:white;
    padding:12px;
    border:none;
    border-radius:5px;
    font-weight:bold;
    cursor:pointer;
    width:100%;
    font-size:16px;
    margin-top:8px;
}

.btn:hover{
    background:#2b6cb0;
}

.logout{
    background:#e53e3e;
    width:auto;
    padding:7px 14px;
    font-size:13px;
}

.alert{
    display:none;
    padding:10px;
    border-radius:5px;
    margin-bottom:15px;
    text-align:center;
    font-weight:bold;
}

.error{
    background:#fed7d7;
    color:#9b2c2c;
}

.success{
    background:#c6f6d5;
    color:#22543d;
}

.posts-section{
    margin-top:35px;
    border-top:2px solid #e2e8f0;
    padding-top:20px;
}

.post-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    background:#f7fafc;
    border:1px solid #e2e8f0;
    border-radius:6px;
    padding:12px;
    margin-bottom:10px;
}

.post-info{
    flex:1;
}

.post-title{
    font-weight:bold;
    color:#2d3748;
    margin-bottom:5px;
}

.post-category{
    color:#718096;
    font-size:12px;
}

.remove-btn{
    background:#e53e3e;
    color:white;
    border:none;
    border-radius:4px;
    padding:8px 12px;
    cursor:pointer;
    font-weight:bold;
}

.remove-btn:hover{
    background:#c53030;
}

.empty{
    text-align:center;
    color:#718096;
    padding:15px;
}

@media(max-width:600px){

    .form-row{
        flex-direction:column;
        gap:0;
    }

    .post-item{
        flex-direction:column;
        align-items:stretch;
    }

    .remove-btn{
        width:100%;
    }
}
</style>
</head>

<body>

<header>

<h1>Dforms803 - Admin Panel</h1>

<button
id="logoutBtn"
class="btn logout"
style="display:none"
onclick="logout()">
Logout
</button>

</header>


<!-- LOGIN -->

<div id="loginBox" class="container">

<h2>Admin Login</h2>

<div id="loginError" class="alert error">
गलत पासवर्ड
</div>

<form id="loginForm">

<div class="form-group">

<label>Admin Password</label>

<input
type="password"
id="adminPass"
placeholder="Enter Password"
required>

</div>

<button class="btn" type="submit">
Login
</button>

</form>

</div>


<!-- DASHBOARD -->

<div id="dashboard" class="container">

<div id="successMsg" class="alert success">
Form Successfully Published!
</div>

<div id="removeMsg" class="alert success">
Form Successfully Removed!
</div>


<h2>Publish New Form</h2>


<form id="postForm">

<div class="form-row">

<div class="form-group">

<label>Category</label>

<select id="category">

<option value="latest">
Latest Forms
</option>

<option value="admit">
Admit Cards
</option>

<option value="result">
Results
</option>

</select>

</div>


<div class="form-group">

<label>Form Title</label>

<input
type="text"
id="title"
placeholder="Example: SSC CGL Recruitment 2026"
required>

</div>

</div>


<div class="form-row">

<div class="form-group">

<label>Start Date</label>

<input
type="text"
id="startDate"
placeholder="10/08/2026">

</div>


<div class="form-group">

<label>Last Date</label>

<input
type="text"
id="lastDate"
placeholder="31/08/2026">

</div>


<div class="form-group">

<label>Exam Date</label>

<input
type="text"
id="examDate"
placeholder="September 2026">

</div>

</div>


<div class="form-row">

<div class="form-group">

<label>Fee General / OBC</label>

<input
type="text"
id="feeGen"
placeholder="₹500">

</div>


<div class="form-group">

<label>Fee SC / ST / Female</label>

<input
type="text"
id="feeSc"
placeholder="₹250 / ₹0">

</div>


<div class="form-group">

<label>Payment Mode</label>

<input
type="text"
id="payMode"
placeholder="Online">

</div>

</div>


<div class="form-group">

<label>Age Limit</label>

<input
type="text"
id="ageLimit"
placeholder="18 - 25 Years">

</div>


<div class="form-group">

<label>Qualification Required</label>

<textarea
id="qualification"
rows="3"
placeholder="10th Pass / 12th Pass / Graduation"></textarea>

</div>


<div class="form-group">

<label>Apply Online Link</label>

<input
type="url"
id="applyLink"
placeholder="Apply link"
required>

</div>


<div class="form-row">

<div class="form-group">

<label>Notification PDF Link</label>

<input
type="url"
id="notifLink"
placeholder="PDF link">

</div>


<div class="form-group">

<label>Official Website Link</label>

<input
type="url"
id="officialLink"
placeholder="Official website">

</div>

</div>


<button
class="btn"
type="submit">

Publish Full Form

</button>

</form>


<!-- POSTS -->

<div class="posts-section">

<h2>Published Forms</h2>

<div id="postsList"></div>

</div>


<br>

<p style="text-align:center">

<a
href="index.html"
style="color:#3182ce;font-weight:bold;text-decoration:none">

← Go to Homepage

</a>

</p>

</div>


<script>

/* ==============================
   SUPABASE CONFIG
============================== */

const SUPABASE_URL =
"https://" + "dxdhouchxmsibyjrnagq.supabase.co";

const SUPABASE_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR4ZGhvdWNoeG1zaWJ5anJuYWdxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1NTE1MTUsImV4cCI6MjEwMjEyNzUxNX0.4nQFAiB2aFPtFKJfgq7LNr20AWEE0knx3BH8r-ljhwc";

const API_URL =
SUPABASE_URL + "/rest/v1/posts";


/* ==============================
   HEADERS
============================== */

const headers = {

    "apikey": SUPABASE_KEY,

    "Authorization":
    "Bearer " + SUPABASE_KEY,

    "Content-Type":
    "application/json"

};


/* ==============================
   LOGIN
============================== */

const ADMIN_PASSWORD = "admin803";


window.onload = function(){

    if(
        sessionStorage.getItem("isLoggedIn")
        === "true"
    ){

        showDashboard();

    }

};


document
.getElementById("loginForm")
.addEventListener("submit",function(e){

    e.preventDefault();

    const password =
    document.getElementById("adminPass").value;

    if(password === ADMIN_PASSWORD){

        sessionStorage.setItem(
            "isLoggedIn",
            "true"
        );

        showDashboard();

    }
    else{

        document
        .getElementById("loginError")
        .style.display="block";

    }

});


/* ==============================
   SHOW DASHBOARD
============================== */

function showDashboard(){

    document
    .getElementById("loginBox")
    .style.display="none";

    document
    .getElementById("dashboard")
    .style.display="block";

    document
    .getElementById("logoutBtn")
    .style.display="block";

    loadPosts();

}


/* ==============================
   LOGOUT
============================== */

function logout(){

    sessionStorage.removeItem(
        "isLoggedIn"
    );

    location.reload();

}


/* ==============================
   PUBLISH
============================== */

document
.getElementById("postForm")
.addEventListener("submit",async function(e){

    e.preventDefault();

    const newPost = {

        category:
        document.getElementById("category").value,

        title:
        document.getElementById("title").value,

        start_date:
        document.getElementById("startDate").value,

        last_date:
        document.getElementById("lastDate").value,

        exam_date:
        document.getElementById("examDate").value,

        fee_gen:
        document.getElementById("feeGen").value,

        fee_sc:
        document.getElementById("feeSc").value,

        pay_mode:
        document.getElementById("payMode").value,

        age_limit:
        document.getElementById("ageLimit").value,

        qualification:
        document.getElementById("qualification").value,

        apply_link:
        document.getElementById("applyLink").value,

        notif_link:
        document.getElementById("notifLink").value,

        official_link:
        document.getElementById("officialLink").value

    };


    try{

        const response =
        await fetch(
            API_URL,
            {
                method:"POST",

                headers:{
                    ...headers,
                    "Prefer":"return=representation"
                },

                body:
                JSON.stringify(newPost)
            }
        );


        if(!response.ok){

            const error =
            await response.text();

            throw new Error(error);

        }


        document
        .getElementById("successMsg")
        .style.display="block";


        document
        .getElementById("postForm")
        .reset();


        loadPosts();


        setTimeout(function(){

            document
            .getElementById("successMsg")
            .style.display="none";

        },3000);

    }

    catch(error){

        console.error(error);

        alert(
            "Form publish नहीं हुआ।\n\n" +
            error.message
        );

    }

});


/* ==============================
   LOAD POSTS
============================== */

async function loadPosts(){

    const postsList =
    document.getElementById("postsList");

    postsList.innerHTML =
    '<div class="empty">Loading...</div>';


    try{

        const response =
        await fetch(
            API_URL +
            "?select=*&order=created_at.desc",
            {
                method:"GET",
                headers:headers
            }
        );


        if(!response.ok){

            throw new Error(
                await response.text()
            );

        }


        const posts =
        await response.json();


        postsList.innerHTML="";


        if(posts.length === 0){

            postsList.innerHTML =
            '<div class="empty">अभी कोई published form नहीं है।</div>';

            return;

        }


        posts.forEach(function(post){

            const item =
            document.createElement("div");

            item.className="post-item";


            const info =
            document.createElement("div");

            info.className="post-info";


            const title =
            document.createElement("div");

            title.className="post-title";

            title.textContent =
            post.title;


            const category =
            document.createElement("div");

            category.className="post-category";

            category.textContent =
            "Category: " +
            getCategoryName(post.category);


            info.appendChild(title);

            info.appendChild(category);


            const removeButton =
            document.createElement("button");

            removeButton.className =
            "remove-btn";

            removeButton.textContent =
            "🗑️ Remove";


            removeButton.onclick =
            function(){

                removePost(post.id);

            };


            item.appendChild(info);

            item.appendChild(removeButton);

            postsList.appendChild(item);

        });

    }

    catch(error){

        console.error(error);

        postsList.innerHTML =
        '<div class="empty">Posts load नहीं हो सके।</div>';

    }

}


/* ==============================
   CATEGORY
============================== */

function getCategoryName(category){

    if(category==="latest")
        return "Latest Forms";

    if(category==="admit")
        return "Admit Cards";

    if(category==="result")
        return "Results";

    return category;

}


/* ==============================
   DELETE
============================== */

async function removePost(postId){

    if(
        !confirm(
            "क्या आप इस form को permanently remove करना चाहते हैं?"
        )
    ){

        return;

    }


    try{

        const response =
        await fetch(
            API_URL +
            "?id=eq." +
            encodeURIComponent(postId),
            {

                method:"DELETE",

                headers:headers

            }
        );


        if(!response.ok){

            throw new Error(
                await response.text()
            );

        }


        document
        .getElementById("removeMsg")
        .style.display="block";


        loadPosts();


        setTimeout(function(){

            document
            .getElementById("removeMsg")
            .style.display="none";

        },3000);

    }

    catch(error){

        console.error(error);

        alert(
            "Delete नहीं हुआ।\n\n" +
            error.message
        );

    }

}

</script>

</body>
</html>
